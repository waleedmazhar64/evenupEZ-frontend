<app-auth-layout>
    <div class="signup_main">
        <div class="signup_title text-center">
            <h2>Reset Password</h2>
        </div>
        <form (submit)="onSubmit()" #resetForm="ngForm">
  
  <div class="signup_item">
    <input type="password" placeholder="New Password" id="password" name="password" [(ngModel)]="data.password" required />
  
    <input
    placeholder="Confirm Password"
      type="password"
      id="password_confirmation"
      name="password_confirmation"
      [(ngModel)]="data.password_confirmation"
      required
    />
  
  <button type="submit" [disabled]="!resetForm.valid">Reset Password</button>
</div>
</form>
    </div>
</app-auth-layout>
