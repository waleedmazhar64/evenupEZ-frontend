<app-auth-layout>
    <div class="signup_main">
        <div class="signup_title text-center">
            <h2>Forget Password?</h2>
        </div>
        <form (submit)="onSubmit()" #forgotForm="ngForm">
  <div class="signup_item">
    <input type="email" placeholder="Email" id="email" name="email" [(ngModel)]="email" required />
  
  <button type="submit" [disabled]="!forgotForm.valid">Send Reset Link</button>
</div>
</form>
    </div>
</app-auth-layout>
